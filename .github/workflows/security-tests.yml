
name: AgentShield Security Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run isolated security tests
        run: |
          uv run --locked pytest -v \
            --ignore=test_concurrent_agents.py \
            --ignore=test_multi_agent_policy.py \
            --ignore=test_policy_service.py
